<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelvin Wake Duck</title>
<meta name="description" content="A cartoon duck simulator showing that the Kelvin wake angle stays about 19.47 degrees at any speed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --water: #8ccff0; --ink: #151515; --yellow: #fbe27a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--water);
    font-family: Fredoka, ui-rounded, system-ui, sans-serif;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    touch-action: none; display: block;
  }
  #sound {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center;
    font-size: 20px; line-height: 1;
    border: 3px solid var(--ink); border-radius: 14px; background: #fff;
    box-shadow: 2px 3px 0 var(--ink); cursor: pointer;
    transition: transform .06s, box-shadow .06s;
    user-select: none; -webkit-user-select: none;
  }
  #sound[aria-pressed="true"] { background: var(--yellow); }
  #sound:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
  #sound:focus-visible { outline: 3px solid #2f7fd0; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="lake" aria-label="Lake with a duck that follows the pointer and leaves a wake."></canvas>
<button id="sound" aria-pressed="false" aria-label="Sound">🔇</button>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('lake');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const TAU = Math.PI * 2;
  const KELVIN = Math.asin(1 / 3);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

  // ---------- wake physics ----------
  // Deep-water waves: phase speed c = sqrt(g/k), group speed c/2. A source moving at U makes
  // steady waves travelling at angle θ to its path with c = U cosθ. Energy emitted τ seconds ago
  // has moved U cosθ τ / 2 along that direction, carrying phase gτ / (2U cosθ). Joining equal
  // phases gives the Kelvin crests, whose envelope sits at arcsin(1/3) ≈ 19.47°.
  // For readability the crest spacing never drops below LAMBDA_MIN; this scales the pattern
  // without changing its shape or angle.
  const G = 9000;
  const LAMBDA_MIN = 85;
  const MAX_AGE = 4.5;
  const THETA_MAX = 80 * Math.PI / 180;
  const NT = 121;
  const MAX_LEVEL = 9;
  const MIN_U = 40;
  const MAX_SPEED = 760;
  const BREAK = 170;

  const cosT = new Float32Array(NT), sinT = new Float32Array(NT), wT = new Float32Array(NT);
  for (let j = 0; j < NT; j++) {
    const th = -THETA_MAX + (2 * THETA_MAX) * j / (NT - 1);
    cosT[j] = Math.cos(th); sinT[j] = Math.sin(th);
    wT[j] = smooth(0.02, 0.3, cosT[j] * cosT[j]);
  }
  const CX = new Float32Array((MAX_LEVEL + 1) * NT);
  const CY = new Float32Array((MAX_LEVEL + 1) * NT);
  const CA = new Float32Array((MAX_LEVEL + 1) * NT);

  let simT = 0, clock = 0;
  const hist = [];

  const duck = { x: 0, y: 0, vx: 0, vy: 0, heading: 0, speed: 0 };
  const pointer = { x: 0, y: 0, active: false };

  const SPAN = 25 * Math.PI / 180;
  let scaleR = 400;
  const rings = [];
  let lastRing = 0;

  function sample(u) {
    const U = Math.max(u, MIN_U);
    const lambda = TAU * U * U / G;
    const scale = lambda < LAMBDA_MIN ? lambda / LAMBDA_MIN : 1;
    return { k: scale / U, amp: smooth(60, 240, u) };
  }

  function resize() {
    const first = W === 0;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scaleR = clamp(Math.max(W, H) * 0.4, 230, 560);
    if (first) init();
    duck.x = clamp(duck.x, 30, W - 30); duck.y = clamp(duck.y, 30, H - 30);
  }

  function init() {
    const U0 = 380;
    duck.x = W * 0.55; duck.y = H * 0.55;
    duck.vx = U0; duck.vy = -U0 * 0.1; duck.heading = Math.atan2(duck.vy, duck.vx);
    const dx = Math.cos(duck.heading), dy = Math.sin(duck.heading);
    const s = sample(U0);
    simT = MAX_AGE;
    for (let tau = MAX_AGE; tau > 0; tau -= 1 / 60) {
      hist.push({ t: simT - tau, x: duck.x - dx * U0 * tau, y: duck.y - dy * U0 * tau, dx, dy, u: U0, k: s.k, amp: s.amp });
    }
  }

  // ---------- simulation ----------
  function updateDuck(dt) {
    if (pointer.active) {
      const tx = pointer.x - duck.x, ty = pointer.y - duck.y;
      const d = Math.hypot(tx, ty);
      let dvx = 0, dvy = 0;
      // ease in: no pull when the pointer is right on the duck, full speed when far away
      if (d > 4) {
        const s = Math.min(MAX_SPEED, (d - 4) * 2.6);
        dvx = tx / d * s; dvy = ty / d * s;
      }
      const k = 1 - Math.exp(-dt * 3.2);
      duck.vx += (dvx - duck.vx) * k; duck.vy += (dvy - duck.vy) * k;
    } else {
      const f = Math.exp(-dt * 0.55);
      duck.vx *= f; duck.vy *= f;
    }
    duck.x += duck.vx * dt; duck.y += duck.vy * dt;
    const m = 30;
    if (duck.x < m) { duck.x = m; duck.vx = Math.abs(duck.vx) * 0.3; }
    if (duck.x > W - m) { duck.x = W - m; duck.vx = -Math.abs(duck.vx) * 0.3; }
    if (duck.y < m) { duck.y = m; duck.vy = Math.abs(duck.vy) * 0.3; }
    if (duck.y > H - m) { duck.y = H - m; duck.vy = -Math.abs(duck.vy) * 0.3; }
    duck.speed = Math.hypot(duck.vx, duck.vy);
    if (duck.speed > 6) {
      duck.heading += angDiff(duck.heading, Math.atan2(duck.vy, duck.vx)) * (1 - Math.exp(-dt * 9));
    }

    const u = duck.speed;
    const dx = u > 1 ? duck.vx / u : Math.cos(duck.heading);
    const dy = u > 1 ? duck.vy / u : Math.sin(duck.heading);
    const s = sample(u);
    hist.push({ t: simT, x: duck.x, y: duck.y, dx, dy, u, k: s.k, amp: s.amp });
    while (hist.length && simT - hist[0].t > MAX_AGE) hist.shift();

    if (u < 40 && simT - lastRing > 2.8) { rings.push({ x: duck.x, y: duck.y, t: simT }); lastRing = simT; }
    for (let i = rings.length - 1; i >= 0; i--) if (simT - rings[i].t > 3) rings.splice(i, 1);
  }

  function computeWake() {
    CX.fill(NaN); CY.fill(NaN); CA.fill(0);
    const n = hist.length;
    if (n < 2) return;
    const fadeStart = MAX_AGE * 0.4;
    for (let j = 0; j < NT; j++) {
      const c = cosT[j], s = sinT[j], w = wT[j];
      if (w < 0.02) continue;
      let pLv = 0, pX = 0, pY = 0, pA = 0, has = false;
      for (let i = n - 1; i >= 0; i--) {
        const h = hist[i];
        const tau = simT - h.t;
        const U = h.u > MIN_U ? h.u : MIN_U;
        const lv = G * tau * h.k / (4 * Math.PI * c);
        const r = U * c * tau * 0.5;
        const nx = h.dx * c - h.dy * s, ny = h.dx * s + h.dy * c;
        const x = h.x + nx * r, y = h.y + ny * r;
        const a = h.amp * w * (1 - smooth(fadeStart, MAX_AGE, tau));
        if (has) {
          const lo = Math.min(pLv, lv), hi = Math.max(pLv, lv);
          if (hi - lo < 1.5) {
            for (let L = Math.floor(lo) + 1; L <= hi && L <= MAX_LEVEL; L++) {
              if (L < 1) continue;
              const k = L * NT + j;
              if (CX[k] === CX[k]) continue;
              const f = (L - pLv) / (lv - pLv);
              CX[k] = pX + (x - pX) * f;
              CY[k] = pY + (y - pY) * f;
              CA[k] = pA + (a - pA) * f;
            }
          }
        }
        pLv = lv; pX = x; pY = y; pA = a; has = true;
      }
    }
  }

  // ---------- drawing ----------
  const INK = '#151515';
  const DASH = [90, 22, 50, 18, 130, 24];
  const NB = 8;
  const inkStyle = [], shadowStyle = [], inkW = [], shadowW = [];
  for (let b = 0; b < NB; b++) {
    const a = (b + 0.5) / NB;
    inkStyle.push(`rgba(21,21,21,${Math.min(1, 0.35 + 1.0 * a).toFixed(3)})`);
    shadowStyle.push(`rgba(46,128,196,${(0.35 * a).toFixed(3)})`);
    inkW.push(3 + 5.5 * a);
    shadowW.push((3 + 5.5 * a) * 2.1);
  }
  const bucketOf = a => Math.min(NB - 1, Math.floor(clamp(a, 0, 1) * NB));

  function strokeRun(b, shadow) {
    ctx.strokeStyle = shadow ? shadowStyle[b] : inkStyle[b];
    ctx.lineWidth = shadow ? shadowW[b] : inkW[b];
    ctx.stroke();
  }

  function drawWake(shadow) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash(DASH);
    const ox = shadow ? 4 : 0, oy = shadow ? 7 : 0;
    for (let L = 1; L <= MAX_LEVEL; L++) {
      const base = L * NT;
      let open = false, bucket = 0, cum = L * 71, lx = 0, ly = 0;
      for (let j = 0; j < NT; j++) {
        const k = base + j, x = CX[k], y = CY[k], a = CA[k];
        if (!(a > 0.2)) { if (open) { strokeRun(bucket, shadow); open = false; } continue; }
        if (open) {
          const d = Math.hypot(x - lx, y - ly);
          if (d <= BREAK) {
            ctx.lineTo(x + ox, y + oy); cum += d; lx = x; ly = y;
            const b = bucketOf(a);
            if (b !== bucket) {
              strokeRun(bucket, shadow);
              ctx.beginPath(); ctx.lineDashOffset = cum; ctx.moveTo(x + ox, y + oy); bucket = b;
            }
            continue;
          }
          strokeRun(bucket, shadow); open = false;
        }
        ctx.beginPath(); ctx.lineDashOffset = cum; ctx.moveTo(x + ox, y + oy);
        bucket = bucketOf(a); open = true; lx = x; ly = y;
      }
      if (open) strokeRun(bucket, shadow);
    }
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }

  function drawWater() {
    ctx.fillStyle = '#8ccff0';
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.7, H * 0.2, 0, W * 0.7, H * 0.2, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(255,255,255,0.14)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawRings() {
    ctx.setLineDash([60, 22]);
    ctx.lineCap = 'round';
    for (const r of rings) {
      const age = simT - r.t;
      const rad = 46 + 30 * age;
      const a = 1 - age / 3;
      ctx.lineWidth = 9 * a + 2;
      ctx.strokeStyle = `rgba(46,128,196,${0.3 * a})`;
      ctx.beginPath(); ctx.arc(r.x + 4, r.y + 7, rad, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(21,21,21,${0.9 * a})`;
      ctx.lineWidth = 5 * a + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0.3 + age * 0.5, TAU - 0.5 + age * 0.5); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawBow() {
    const sp = smooth(60, 500, duck.speed);
    if (sp <= 0.01) return;
    ctx.save();
    ctx.translate(duck.x, duck.y); ctx.rotate(duck.heading);
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(46,128,196,${0.35 * sp})`; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.arc(20, 7, 62, -1.0, 1.0); ctx.stroke();
    ctx.strokeStyle = `rgba(21,21,21,${sp})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(16, 0, 62, -1.0, 1.0); ctx.stroke();
    ctx.restore();
  }

  // ---------- hand-drawn helpers ----------
  // Outlines wobble a little, vary in thickness, overshoot where they close, and the fill sits
  // slightly off the line. The wobble re-rolls a few times a second like a hand-animated "boil".
  let boil = 0;

  function sketchLine(pts, seed, base) {
    // smooth curve through pts, stroked in short pieces with varying width
    const n = pts.length;
    if (n < 2) return;
    const p1 = hash(seed, boil) * TAU, p2 = hash(seed + 3, boil) * TAU;
    let prev = pts[0];
    for (let i = 1; i < n; i++) {
      const t = i / (n - 1);
      ctx.lineWidth = base * (1 + 0.28 * Math.sin(t * 5 + p1) + 0.14 * Math.sin(t * 11 + p2));
      ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
      prev = pts[i];
    }
  }

  function wobbleEllipsePts(e, seed, from, to, n, amp) {
    const ph = [hash(seed, boil) * TAU, hash(seed + 1, boil) * TAU, hash(seed + 2, boil) * TAU];
    const ca = Math.cos(e.ang), sa = Math.sin(e.ang);
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = from + (to - from) * i / n;
      const off = amp * (0.6 * Math.sin(2 * t + ph[0]) + 0.4 * Math.sin(3 * t + ph[1]) + 0.25 * Math.sin(5 * t + ph[2]));
      const lx = (e.rx + off) * Math.cos(t), ly = (e.ry + off) * Math.sin(t);
      pts.push({ x: e.x + lx * ca - ly * sa, y: e.y + lx * sa + ly * ca });
    }
    return pts;
  }

  function sketchBlob(e, fill, seed) {
    const amp = Math.min(2.2, 0.08 * Math.min(e.rx, e.ry) + 0.8);
    // fill, nudged off the outline
    const fp = wobbleEllipsePts(e, seed + 10, 0, TAU, 36, amp);
    ctx.beginPath();
    ctx.moveTo(fp[0].x + 1.6, fp[0].y + 1.2);
    for (const p of fp) ctx.lineTo(p.x + 1.6, p.y + 1.2);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    // outline with a little overshoot past the start
    const start = hash(seed, 7) * TAU;
    ctx.strokeStyle = INK;
    sketchLine(wobbleEllipsePts(e, seed, start, start + TAU + 0.35, 48, amp), seed, 5);
  }

  // ---------- duck (3/4 view) ----------
  // The water is drawn straight down so angles measure true; the duck is drawn
  // from a camera tilted CAM above the horizon so it reads as a floating toy.
  const CAM = 48 * Math.PI / 180;
  const SINC = Math.sin(CAM), COSC = Math.cos(CAM);
  const YELLOW = '#fbe27a', ORANGE = '#f7a13b';
  const WING = [[48, 28], [72, 40], [102, 42], [128, 32], [142, 15], [137, 0], [120, -7], [100, -4]];

  function drawDuck() {
    const sp = clamp(duck.speed / 600, 0, 1);
    const bob = Math.sin(clock * 2.3) * 1.6 * (1 - sp);
    const wob = Math.sin(clock * 14) * 0.05 * sp;
    const h = duck.heading + wob;
    const ch = Math.cos(h), sh = Math.sin(h);

    const P = (f, s, u) => {
      const X = f * ch - s * sh, Y = f * sh + s * ch;
      return { x: duck.x + X, y: duck.y + Y * SINC - (u + bob) * COSC, d: Y * COSC + u * SINC };
    };
    const facing = (nf, ns, nu) => (nf * sh + ns * ch) * COSC + nu * SINC;
    const ell = (cf, cs, cu, a, b, c, pitch) => {
      const cp = Math.cos(pitch), spn = Math.sin(pitch);
      const cols = [[a * cp, 0, a * spn], [0, b, 0], [-c * spn, 0, c * cp]];
      let p = 0, q = 0, r = 0;
      for (const [f, s, u] of cols) {
        const X = f * ch - s * sh, Y = f * sh + s * ch;
        const sx = X, sy = Y * SINC - u * COSC;
        p += sx * sx; q += sx * sy; r += sy * sy;
      }
      const m = (p + r) / 2, dd = Math.sqrt(((p - r) / 2) ** 2 + q * q);
      const c0 = P(cf, cs, cu);
      return { x: c0.x, y: c0.y, d: c0.d, rx: Math.sqrt(m + dd), ry: Math.sqrt(Math.max(0.01, m - dd)), ang: 0.5 * Math.atan2(2 * q, p - r) };
    };

    ctx.save();
    ctx.translate(duck.x, duck.y); ctx.scale(1.25, 1.25); ctx.translate(-duck.x, -duck.y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // shadow on the water
    {
      const e = ell(-4, 0, -bob, 50, 36, 0.1, 0);
      ctx.beginPath(); ctx.ellipse(e.x + 5, e.y + 8, e.rx, e.ry, e.ang, 0, TAU);
      ctx.fillStyle = 'rgba(40,118,190,0.4)'; ctx.fill();
    }

    const BODY = { cf: 0, cu: 12, a: 40, b: 28, c: 22 };
    const HEAD = { cf: 25, cu: 42, r: 18 };
    const parts = [
      {
        e: ell(BODY.cf, 0, BODY.cu, BODY.a, BODY.b, BODY.c, 0), fill: YELLOW, seed: 1,
        after() {
          ctx.strokeStyle = INK;
          for (const sg of [-1, 1]) {
            let run = [];
            const flush = () => { if (run.length > 1) sketchLine(run, 20 + sg, 4.6); run = []; };
            WING.forEach(([lonD, latD], i) => {
              const lon = lonD * Math.PI / 180, lat = latD * Math.PI / 180;
              const cl = Math.cos(lat);
              const nf = cl * Math.cos(lon) / BODY.a, ns = sg * cl * Math.sin(lon) / BODY.b, nu = Math.sin(lat) / BODY.c;
              const pt = P(BODY.cf + BODY.a * cl * Math.cos(lon), sg * BODY.b * cl * Math.sin(lon), BODY.cu + BODY.c * Math.sin(lat));
              pt.x += (hash(i + sg * 5, boil) - 0.5) * 1.6; pt.y += (hash(i + sg * 9, boil + 1) - 0.5) * 1.6;
              if (facing(nf, ns, nu) > 0) run.push(pt); else flush();
            });
            flush();
          }
        }
      },
      { e: ell(-36, 0, 26, 15, 10, 8, -0.6), fill: YELLOW, seed: 2 },
      {
        e: ell(HEAD.cf, 0, HEAD.cu, HEAD.r, HEAD.r, HEAD.r, 0), fill: YELLOW, seed: 3,
        after() {
          for (const sg of [-1, 1]) {
            let nf = 0.55, ns = 0.62 * sg, nu = 0.42;
            const l = Math.hypot(nf, ns, nu); nf /= l; ns /= l; nu /= l;
            if (facing(nf, ns, nu) < 0.1) continue;
            const pt = P(HEAD.cf + HEAD.r * nf, HEAD.r * ns, HEAD.cu + HEAD.r * nu);
            ctx.fillStyle = INK;
            ctx.beginPath(); ctx.ellipse(pt.x, pt.y, 3.4, 4.2, 0.2 * sg, 0, TAU); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(pt.x + 1.1, pt.y - 1.5, 1.1, 0, TAU); ctx.fill();
          }
        }
      },
      { e: ell(43, 0, 38, 11, 9, 4.5, -0.1), fill: ORANGE, seed: 4 },
    ];
    parts.sort((p1, p2) => p1.e.d - p2.e.d);
    for (const p of parts) { sketchBlob(p.e, p.fill, p.seed); if (p.after) p.after(); }
    ctx.restore();
  }

  // ---------- angle scale ----------
  // A plain white scale pinned to the duck, pointing back along the wake.
  function drawScale() {
    const R = scaleR;
    const rot = duck.heading + Math.PI;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const at = (r, a) => {
      const lx = Math.cos(a) * r, ly = Math.sin(a) * r;
      return { x: duck.x + lx * cr - ly * sr, y: duck.y + lx * sr + ly * cr };
    };
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';

    // ticks
    for (let d = -25; d <= 25; d++) {
      const a = d * Math.PI / 180;
      const major = d % 5 === 0;
      const p = at(R, a), q = at(R - (major ? 22 : 10), a);
      ctx.lineWidth = major ? 3.5 : 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    // the wake's edges
    ctx.setLineDash([14, 10]); ctx.lineWidth = 3;
    for (const sg of [-1, 1]) {
      const p = at(30, KELVIN * sg), q = at(R + 10, KELVIN * sg);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    ctx.setLineDash([]);
    // arc between the edges with the full opening angle
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 30; i++) {
      const p = at(R * 0.42, -KELVIN + 2 * KELVIN * i / 30);
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    }
    ctx.stroke();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 13px Fredoka, ui-rounded, system-ui, sans-serif';
    for (let d = -25; d <= 25; d += 5) {
      const p = at(R + 18, d * Math.PI / 180);
      ctx.fillText(Math.abs(d) + '°', p.x, p.y);
    }
    ctx.font = '700 17px Fredoka, ui-rounded, system-ui, sans-serif';
    const m = at(R * 0.42 + 22, 0);
    ctx.fillText('39°', m.x, m.y);
    for (const sg of [-1, 1]) {
      const p = at(R + 40, KELVIN * sg);
      ctx.fillText('19.5°', p.x, p.y);
    }
  }

  function render() {
    drawWater();
    drawRings();
    drawWake(true);
    drawWake(false);
    drawBow();
    drawScale();
    drawDuck();
  }

  // ---------- sound: water laps, drips, birds and paddling splashes ----------
  let audio = null;
  let wantSound = true;
  const btnSound = document.getElementById('sound');

  function makeNoise(ac, brown) {
    const len = Math.floor(ac.sampleRate * 4);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    return buf;
  }

  function createAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const white = makeNoise(ac, false), brown = makeNoise(ac, true);
    const bed = ac.createBufferSource(); bed.buffer = brown; bed.loop = true;
    const bedLP = ac.createBiquadFilter(); bedLP.type = 'lowpass'; bedLP.frequency.value = 160; bedLP.Q.value = 0.3;
    const bedG = ac.createGain(); bedG.gain.value = 0.05;
    bed.connect(bedLP).connect(bedG).connect(master); bed.start();
    const t = ac.currentTime;
    audio = { ac, master, white, brown, nextLap: t + 0.6, nextDrop: t + 1.5, nextBird: t + 4 + Math.random() * 5, nextPaddle: t };
    ac.onstatechange = syncSound;
  }

  function syncSound() {
    const on = !!(audio && wantSound && audio.ac.state === 'running');
    btnSound.setAttribute('aria-pressed', String(on));
    btnSound.textContent = on ? '🔊' : '🔇';
    btnSound.setAttribute('aria-label', on ? 'Mute' : 'Unmute');
    if (audio) audio.master.gain.setTargetAtTime(on ? 0.9 : 0, audio.ac.currentTime, on ? 0.8 : 0.2);
  }

  // Browsers only let sound start after a click, tap or key press.
  function unlock() {
    if (!wantSound) return;
    if (!audio) createAudio();
    if (audio && audio.ac.state !== 'running') audio.ac.resume().then(syncSound, () => {});
    syncSound();
  }
  window.addEventListener('pointerdown', e => { if (e.target !== btnSound) unlock(); }, true);
  window.addEventListener('keydown', unlock, true);

  btnSound.addEventListener('click', () => {
    const playing = audio && wantSound && audio.ac.state === 'running';
    wantSound = !playing;
    if (wantSound) unlock(); else syncSound();
  });

  function panner(v) {
    const ac = audio.ac;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(v, -1, 1); return p; }
    return ac.createGain();
  }

  function burst(buf, when, dur, freq, q, peak, attack, pan) {
    const { ac, master } = audio;
    const s = ac.createBufferSource(); s.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = Math.min(4000, freq * 3);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.exponentialRampToValueAtTime(0.0005, when + dur);
    s.connect(bp).connect(lp).connect(g).connect(panner(pan)).connect(master);
    s.start(when, Math.random() * 3, dur + 0.05);
  }

  function lap() {
    const t = audio.ac.currentTime + 0.02;
    const pan = Math.random() * 1.2 - 0.6;
    burst(audio.brown, t, 0.9 + Math.random() * 0.4, 280 + Math.random() * 260, 1.3, 0.5 + Math.random() * 0.3, 0.12, pan);
    if (Math.random() < 0.5) burst(audio.brown, t + 0.32, 0.6, 360 + Math.random() * 200, 1.4, 0.25, 0.08, pan);
  }

  function drop(gain = 0.035) {
    const { ac, master } = audio, t = ac.currentTime + 0.01;
    const o = ac.createOscillator(); o.type = 'sine';
    const f = 380 + Math.random() * 520;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 2.4, t + 0.06);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0003, t + 0.09);
    o.connect(g).connect(panner(Math.random() * 1.6 - 0.8)).connect(master);
    o.start(t); o.stop(t + 0.1);
  }

  function birds() {
    const { ac, master } = audio;
    let t = ac.currentTime + 0.05;
    const base = 2600 + Math.random() * 1400;
    const n = 2 + Math.floor(Math.random() * 3);
    const out = ac.createGain(); out.gain.value = 0.45;
    out.connect(panner(Math.random() * 1.6 - 0.8)).connect(master);
    for (let i = 0; i < n; i++) {
      const o = ac.createOscillator(); o.type = 'sine';
      const f = base * (0.92 + Math.random() * 0.16);
      o.frequency.setValueAtTime(f, t);
      o.frequency.linearRampToValueAtTime(f * 1.3, t + 0.05);
      o.frequency.linearRampToValueAtTime(f * 0.9, t + 0.12);
      const g = ac.createGain(); g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.045, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.14);
      o.connect(g).connect(out); o.start(t); o.stop(t + 0.16);
      t += 0.15 + Math.random() * 0.12;
    }
  }

  function audioTick() {
    if (!audio || !wantSound || audio.ac.state !== 'running') return;
    const t = audio.ac.currentTime;
    if (t > audio.nextLap) { lap(); audio.nextLap = t + 1.4 + Math.random() * 2.6; }
    if (t > audio.nextDrop) {
      drop();
      if (Math.random() < 0.3) setTimeout(() => audio && drop(0.022), 120 + Math.random() * 200);
      audio.nextDrop = t + 0.8 + Math.random() * 2.5;
    }
    if (t > audio.nextBird) { birds(); audio.nextBird = t + 8 + Math.random() * 14; }
    const sp = smooth(40, 650, duck.speed);
    if (sp > 0.03 && t > audio.nextPaddle) {
      const pan = (duck.x / Math.max(1, W)) * 1.2 - 0.6;
      burst(audio.white, t + 0.01, 0.12 + 0.06 * sp, 700 + 700 * sp, 1.0, 0.22 * sp, 0.006, pan);
      audio.nextPaddle = t + 1 / (2.4 + 3.2 * sp) * (0.85 + Math.random() * 0.3);
    }
  }

  // ---------- input: the duck follows the pointer, no clicking needed ----------
  const follow = e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; };
  canvas.addEventListener('pointermove', follow);
  canvas.addEventListener('pointerdown', follow);
  canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.active = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; });
  document.addEventListener('pointerleave', () => { pointer.active = false; });
  document.documentElement.addEventListener('mouseleave', () => { pointer.active = false; });
  window.addEventListener('blur', () => { pointer.active = false; });

  // ---------- loop ----------
  window.addEventListener('resize', resize);
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now; clock += dt;
    boil = Math.floor(clock * 6);
    simT += dt;
    updateDuck(dt);
    computeWake();
    render();
    audioTick();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
