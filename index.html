<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelvin Wake Duck</title>
<meta name="description" content="A cartoon duck simulator showing that the Kelvin wake angle stays about 19.47 degrees at any speed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%86%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --water: #5eb2ec; --ink: #151515; --yellow: #fbe27a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--water);
    font-family: Fredoka, ui-rounded, system-ui, sans-serif;
  }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    touch-action: none; display: block;
  }
  #sound {
    position: fixed; top: 14px; right: 14px;
    width: 44px; height: 44px; padding: 0;
    display: grid; place-items: center;
    font-size: 20px; line-height: 1;
    border: 3px solid var(--ink); border-radius: 14px; background: #fff;
    box-shadow: 2px 3px 0 var(--ink); cursor: pointer;
    transition: transform .06s, box-shadow .06s;
    user-select: none; -webkit-user-select: none;
  }
  #sound svg { width: 24px; height: 24px; display: block; }
  #sound:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--ink); }
  #sound:focus-visible { outline: 3px solid #2f7fd0; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="lake" aria-label="Lake with a duck that follows the pointer and leaves a wake."></canvas>
<button id="sound" aria-pressed="false" aria-label="Unmute"></button>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('lake');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const TAU = Math.PI * 2;
  const KELVIN = Math.asin(1 / 3);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

  // ---------- wake physics ----------
  // Linear deep-water waves, dispersion ω² = g k: phase speed c = sqrt(g/k), group speed c/2.
  // Stationary phase for a moving pressure source: for every earlier moment on the duck's path,
  // the waves that are visible now travel at angle θ to the duck's velocity V back then, with
  // c = |V| cosθ. They have moved c·τ/2 (group speed × age τ) from where the duck was, and carry
  // phase g·τ / (2|V| cosθ). Crests are where that phase is a whole number of turns.
  // On a straight run the crests' envelope sits at arcsin(1/3) ≈ 19.47° from the path.
  // Amplitude: the duck is a pressure patch of size SRC_L, so it barely makes waves shorter
  // than itself (factor exp(-(kL)²/4)). Energy spreads out with distance, and crests bunch up
  // and are strongest along the cusp line where θ = arcsin(1/√3) ≈ 35.3°.
  const G = 9000;            // gravity in px/s²
  const SRC_L = 13;          // px, size of the duck's footprint on the water
  const MAX_AGE = 5;
  const THETA_MAX = 82 * Math.PI / 180;
  const THETA_CUSP = Math.asin(1 / Math.sqrt(3));
  const NT = 161;
  const MAX_LEVEL = 18;
  const MIN_U = 30;
  const MAX_SPEED = 760;
  const BREAK = 120;
  const SPREAD_R0 = 180;

  const cosT = new Float32Array(NT), sinT = new Float32Array(NT), cuspT = new Float32Array(NT);
  for (let j = 0; j < NT; j++) {
    const th = -THETA_MAX + (2 * THETA_MAX) * j / (NT - 1);
    cosT[j] = Math.cos(th); sinT[j] = Math.sin(th);
    cuspT[j] = 1 + 0.8 * Math.exp(-(((Math.abs(th) - THETA_CUSP) / 0.09) ** 2));
  }
  const NC = (MAX_LEVEL + 1) * NT;
  const CX = new Float32Array(NC), CY = new Float32Array(NC), CA = new Float32Array(NC), CE = new Float32Array(NC);

  let simT = 0, clock = 0;
  const hist = []; // {t, x, y, dx, dy, u}

  const duck = { x: 0, y: 0, vx: 0, vy: 0, heading: 0, speed: 0 };
  const pointer = { x: 0, y: 0, active: false };

  let scaleR = 400;        // largest the scale gets
  let scaleCur = 0;        // current radius, follows the part of the path the wake came from
  let scaleRot = 0;        // direction the scale opens towards
  let scaleAlpha = 1;
  const rings = [];
  let lastRing = 0;

  let started = false;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scaleR = clamp(Math.min(W, H) * 0.45, 180, 250);
    if (!started && W > 0 && H > 0) { started = true; init(); }
    duck.x = clamp(duck.x, 30, W - 30); duck.y = clamp(duck.y, 30, H - 30);
  }

  function init() {
    const U0 = clamp(W * 0.5 * 0.55, 300, 420);
    duck.x = W * 0.3; duck.y = H * 0.55;
    duck.vx = U0; duck.vy = -U0 * 0.1; duck.heading = Math.atan2(duck.vy, duck.vx);
    scaleRot = duck.heading + Math.PI;
    const dx = Math.cos(duck.heading), dy = Math.sin(duck.heading);
    simT = MAX_AGE;
    for (let tau = MAX_AGE; tau > 0; tau -= 1 / 60) {
      hist.push({ t: simT - tau, x: duck.x - dx * U0 * tau, y: duck.y - dy * U0 * tau, dx, dy, u: U0 });
    }
  }

  // ---------- simulation ----------
  function updateDuck(dt) {
    if (pointer.active) {
      const tx = pointer.x - duck.x, ty = pointer.y - duck.y;
      const d = Math.hypot(tx, ty);
      let dvx = 0, dvy = 0;
      // ease in: no pull when the pointer is right on the duck, full speed when far away
      if (d > 4) {
        const s = Math.min(MAX_SPEED, (d - 4) * 2.6);
        dvx = tx / d * s; dvy = ty / d * s;
      }
      const k = 1 - Math.exp(-dt * 3.2);
      duck.vx += (dvx - duck.vx) * k; duck.vy += (dvy - duck.vy) * k;
    } else {
      const f = Math.exp(-dt * 0.55);
      duck.vx *= f; duck.vy *= f;
    }
    duck.x += duck.vx * dt; duck.y += duck.vy * dt;
    const m = 30;
    if (duck.x < m) { duck.x = m; duck.vx = Math.max(0, duck.vx); }
    if (duck.x > W - m) { duck.x = W - m; duck.vx = Math.min(0, duck.vx); }
    if (duck.y < m) { duck.y = m; duck.vy = Math.max(0, duck.vy); }
    if (duck.y > H - m) { duck.y = H - m; duck.vy = Math.min(0, duck.vy); }
    duck.speed = Math.hypot(duck.vx, duck.vy);
    // turn only when really swimming, so the duck does not spin when it reaches the pointer
    if (duck.speed > 12) {
      duck.heading += angDiff(duck.heading, Math.atan2(duck.vy, duck.vx)) * (1 - Math.exp(-dt * 9)) * smooth(12, 70, duck.speed);
    }

    const u = duck.speed;
    const dx = u > 1 ? duck.vx / u : Math.cos(duck.heading);
    const dy = u > 1 ? duck.vy / u : Math.sin(duck.heading);
    hist.push({ t: simT, x: duck.x, y: duck.y, dx, dy, u });
    while (hist.length && simT - hist[0].t > MAX_AGE) hist.shift();

    if (u < 40 && simT - lastRing > 2.8) { rings.push({ x: duck.x, y: duck.y, t: simT }); lastRing = simT; }
    for (let i = rings.length - 1; i >= 0; i--) if (simT - rings[i].t > 3) rings.splice(i, 1);
  }

  function computeWake() {
    CX.fill(NaN); CA.fill(0);
    const n = hist.length;
    if (n < 2) return;
    const fadeStart = MAX_AGE * 0.6;
    const L2 = SRC_L * SRC_L / 4;
    for (let j = 0; j < NT; j++) {
      const c = cosT[j], s = sinT[j], cb = cuspT[j], c2 = c * c;
      let pLv = 0, pX = 0, pY = 0, pA = 0, has = false;
      for (let i = n - 1; i >= 0; i--) {
        const h = hist[i];
        const tau = simT - h.t;
        const U = h.u > MIN_U ? h.u : MIN_U;
        const lv = G * tau / (4 * Math.PI * U * c);       // phase in turns
        const r = U * c * tau * 0.5;                       // distance travelled at group speed
        const nx = h.dx * c - h.dy * s, ny = h.dx * s + h.dy * c;
        const x = h.x + nx * r, y = h.y + ny * r;
        const k = G / (U * U * c2);                        // wavenumber of this component
        const a = Math.exp(-k * k * L2) * cb * Math.sqrt(SPREAD_R0 / (SPREAD_R0 + r)) *
                  (1 - smooth(fadeStart, MAX_AGE, tau));
        if (has) {
          const lo = Math.min(pLv, lv), hi = Math.max(pLv, lv);
          if (hi - lo < 1.5) {
            for (let L = Math.floor(lo) + 1; L <= hi && L <= MAX_LEVEL; L++) {
              if (L < 1) continue;
              const q = L * NT + j;
              if (CX[q] === CX[q]) continue;
              const f = (L - pLv) / (lv - pLv);
              CX[q] = pX + (x - pX) * f;
              CY[q] = pY + (y - pY) * f;
              CA[q] = pA + (a - pA) * f;
              CE[q] = i + 1 - f;                           // which moment of the path it came from
            }
          }
        }
        pLv = lv; pX = x; pY = y; pA = a; has = true;
      }
    }
  }

  // ---------- drawing ----------
  const INK = '#151515';
  const WATER = '#5eb2ec';
  // broken-line look: on, off, on, off... measured along each crest
  const DASH_PAT = [70, 16, 40, 14, 120, 20];
  const DASH_LEN = DASH_PAT.reduce((a, b) => a + b, 0);
  const dashOn = s => {
    let m = s % DASH_LEN;
    for (let i = 0; i < DASH_PAT.length; i++) { if (m < DASH_PAT[i]) return i % 2 === 0; m -= DASH_PAT[i]; }
    return true;
  };
  const SHADOW = Array.from({ length: 11 }, (_, i) => `rgba(24,88,160,${(0.3 * i / 10).toFixed(3)})`);

  // Each crest is drawn as short round-capped pieces whose width follows the wave's strength,
  // so lines swell where the wave is strong and taper away to nothing where it fades.
  function drawWake(shadow) {
    ctx.lineCap = 'round';
    const ox = shadow ? 4 : 0, oy = shadow ? 7 : 0;
    if (!shadow) ctx.strokeStyle = INK;
    for (let L = 1; L <= MAX_LEVEL; L++) {
      const base = L * NT;
      let s = L * 53, prev = -1;
      for (let j = 0; j < NT; j++) {
        const q = base + j;
        if (!(CA[q] > 0.05)) { prev = -1; continue; }
        if (prev >= 0) {
          const x0 = CX[prev], y0 = CY[prev], x1 = CX[q], y1 = CY[q];
          const d = Math.hypot(x1 - x0, y1 - y0);
          // a big jump means the two points came from different parts of a curving path
          if (d > BREAK || Math.abs(CE[q] - CE[prev]) > 40) { prev = q; continue; }
          if (dashOn(s + d * 0.5)) {
            const a = Math.min(1, (CA[prev] + CA[q]) * 0.5);
            const w = 9.5 * Math.pow(a, 0.75);
            if (w >= 1) {
              if (shadow) {
                ctx.strokeStyle = SHADOW[Math.round(Math.min(1, a * 1.6) * 10)];
                ctx.lineWidth = w * 2 + 3;
              } else ctx.lineWidth = w;
              ctx.beginPath(); ctx.moveTo(x0 + ox, y0 + oy); ctx.lineTo(x1 + ox, y1 + oy); ctx.stroke();
            }
          }
          s += d;
        }
        prev = q;
      }
    }
  }

  function drawWater() {
    ctx.fillStyle = WATER;
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(W * 0.7, H * 0.2, 0, W * 0.7, H * 0.2, Math.max(W, H) * 0.8);
    g.addColorStop(0, 'rgba(255,255,255,0.12)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawRings() {
    ctx.setLineDash([60, 22]);
    ctx.lineCap = 'round';
    for (const r of rings) {
      const age = Math.max(0, simT - r.t);
      const rad = 46 + 30 * age;
      const a = 1 - age / 3;
      ctx.lineWidth = 9 * a + 2;
      ctx.strokeStyle = `rgba(24,88,160,${0.3 * a})`;
      ctx.beginPath(); ctx.arc(r.x + 4, r.y + 7, rad, 0, TAU); ctx.stroke();
      ctx.strokeStyle = `rgba(21,21,21,${0.9 * a})`;
      ctx.lineWidth = 5 * a + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0.3 + age * 0.5, TAU - 0.5 + age * 0.5); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawBow() {
    const sp = smooth(60, 500, duck.speed);
    if (sp <= 0.01) return;
    ctx.save();
    ctx.translate(duck.x, duck.y); ctx.rotate(duck.heading);
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(24,88,160,${0.3 * sp})`; ctx.lineWidth = 13;
    ctx.beginPath(); ctx.arc(20, 7, 62, -1.0, 1.0); ctx.stroke();
    ctx.strokeStyle = `rgba(21,21,21,${sp})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(16, 0, 62, -1.0, 1.0); ctx.stroke();
    ctx.restore();
  }

  // ---------- duck (3/4 view) ----------
  // The water is drawn straight down so angles measure true; the duck is drawn
  // from a camera tilted CAM above the horizon so it reads as a floating toy.
  // Body and head are a union of many ellipsoids: every piece is stroked thick first and
  // filled after, which leaves one clean outline around the whole shape.
  const CAM = 46 * Math.PI / 180;
  const SINC = Math.sin(CAM), COSC = Math.cos(CAM);
  const YELLOW = '#fbe27a', ORANGE = '#f7a13b';
  const LINE = 5;

  // side profile of the body: forward f, height u, semi-axes a (length), b (width), c (height)
  const BODY_KEYS = [
    [24, 15, 15, 19, 17],   // chest
    [6, 14, 22, 28, 21],    // middle
    [-14, 17, 20, 26, 19],  // rear
    [-30, 26, 12, 15, 12],  // tail base
    [-43, 38, 5, 5.5, 5],   // tail tip, raised and rounded
  ];
  // Catmull-Rom through the keys, sampled densely so the union outline has no bumps
  const BODY = [];
  {
    const K = BODY_KEYS, n = K.length, STEPS = 12;
    const at = i => K[clamp(i, 0, n - 1)];
    for (let k = 0; k < n - 1; k++) {
      const p0 = at(k - 1), p1 = at(k), p2 = at(k + 1), p3 = at(k + 2);
      for (let i = 0; i < STEPS; i++) {
        const t = i / STEPS, t2 = t * t, t3 = t2 * t;
        BODY.push(p1.map((_, j) => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t +
          (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
      }
    }
    BODY.push(K[n - 1]);
  }
  const NECK = [18, 31, 12, 14, 10];  // fills the corner between chest and head
  const HEAD = { f: 25, u: 45, r: 19 };
  const WINGS = { f: -6, s: 25, u: 20, a: 20, b: 5.5, c: 11.5, pitch: -0.28, yaw: 0.32 };

  function drawDuck() {
    const sp = clamp(duck.speed / 600, 0, 1);
    const bob = Math.sin(clock * 2.3) * 1.6 * (1 - sp);
    const wob = Math.sin(clock * 14) * 0.05 * sp;
    const h = duck.heading + wob;
    const ch = Math.cos(h), sh = Math.sin(h);

    const P = (f, s, u) => {
      const X = f * ch - s * sh, Y = f * sh + s * ch;
      return { x: duck.x + X, y: duck.y + Y * SINC - (u + bob) * COSC, d: Y * COSC + u * SINC };
    };
    const facing = (nf, ns, nu) => (nf * sh + ns * ch) * COSC + nu * SINC;
    // screen outline of an ellipsoid: centre (cf, cs, cu), semi-axes a, b, c, tilted by pitch then yaw
    const ell = (cf, cs, cu, a, b, c, pitch = 0, yaw = 0) => {
      const cp = Math.cos(pitch), spn = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cols = [[a * cp, 0, a * spn], [0, b, 0], [-c * spn, 0, c * cp]];
      let p = 0, q = 0, r = 0;
      for (const [f0, s0, u] of cols) {
        const f = f0 * cy - s0 * sy, s = f0 * sy + s0 * cy;
        const X = f * ch - s * sh, Y = f * sh + s * ch;
        const sx = X, sy2 = Y * SINC - u * COSC;
        p += sx * sx; q += sx * sy2; r += sy2 * sy2;
      }
      const m = (p + r) / 2, dd = Math.sqrt(((p - r) / 2) ** 2 + q * q);
      const c0 = P(cf, cs, cu);
      return { x: c0.x, y: c0.y, d: c0.d, rx: Math.sqrt(m + dd), ry: Math.sqrt(Math.max(0.01, m - dd)), ang: 0.5 * Math.atan2(2 * q, p - r) };
    };
    const path = e => { ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, e.ry, e.ang, 0, TAU); };
    const blob = (e, fill, lw = LINE) => { path(e); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.stroke(); };

    ctx.save();
    ctx.translate(duck.x, duck.y); ctx.scale(1.25, 1.25); ctx.translate(-duck.x, -duck.y);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = INK;

    // soft shadow on the water
    {
      const e = ell(-6, 0, -bob, 56, 40, 0.1);
      path({ ...e, x: e.x + 6, y: e.y + 9 });
      ctx.fillStyle = 'rgba(24,88,160,0.38)'; ctx.fill();
    }

    const body = BODY.map(([f, u, a, b, c]) => ell(f, 0, u, a, b, c));
    const neck = ell(NECK[0], 0, NECK[1], NECK[2], NECK[3], NECK[4]);
    const head = ell(HEAD.f, 0, HEAD.u, HEAD.r, HEAD.r, HEAD.r);
    const beak = ell(HEAD.f + 21, 0, HEAD.u - 4, 14, 10, 6, -0.15);
    const beakInFront = beak.d > head.d;

    // wings stand out from the sides; a wing turned away from the camera is left hidden
    const wings = [-1, 1].map(sg => {
      const W_ = WINGS;
      return { sg, e: ell(W_.f, sg * W_.s, W_.u, W_.a, W_.b, W_.c, W_.pitch, -sg * W_.yaw), front: facing(0, sg, 0) > -0.2 };
    });
    const drawWing = w => blob(w.e, YELLOW);
    if (!beakInFront) blob(beak, ORANGE, LINE - 0.5);

    // one outline around body + neck + head
    const union = body.concat([neck, head]);
    ctx.lineWidth = LINE * 2;
    for (const e of union) { path(e); ctx.stroke(); }
    ctx.fillStyle = YELLOW;
    for (const e of union) { path(e); ctx.fill(); }

    // back of the head, where it sits on the body
    {
      const rear = P(-10, 0, 20);
      const dir = Math.atan2(rear.y - head.y, rear.x - head.x);
      ctx.lineWidth = LINE;
      ctx.beginPath(); ctx.arc(head.x, head.y, head.rx, dir - 1.1, dir + 1.1); ctx.stroke();
    }

    for (const w of wings) if (w.front) drawWing(w);

    // eyes
    ctx.fillStyle = INK;
    for (const sg of [-1, 1]) {
      let nf = 0.52, ns = 0.66 * sg, nu = 0.4;
      const l = Math.hypot(nf, ns, nu); nf /= l; ns /= l; nu /= l;
      if (facing(nf, ns, nu) < 0.1) continue;
      const p = P(HEAD.f + HEAD.r * nf, HEAD.r * ns, HEAD.u + HEAD.r * nu);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 4.3, 5.3, 0, 0, TAU); ctx.fill();
    }

    if (beakInFront) blob(beak, ORANGE, LINE - 0.5);
    ctx.restore();
  }

  // ---------- angle scale ----------
  // A small white scale pinned to the duck that spans only the wake's 39° opening.
  // Outside the arc: half-angle from the centre line (0 → 19.5° each way).
  // Inside the arc: the full opening, 39°.
  function drawScale() {
    if (scaleAlpha < 0.01) return;
    ctx.save();
    ctx.globalAlpha = scaleAlpha;
    drawScaleMarks();
    ctx.restore();
  }

  // Which part of the path the visible wake came from. Walk back along the path until it has
  // turned more than ~45° from where the duck heads now (or the duck was nearly still). The
  // wake's arms reach out to about 0.7x the distance to that point, and on a gentle curve the
  // V points along the chord towards it, so the scale bends round with the wake.
  function wakeRun() {
    const hx = Math.cos(duck.heading), hy = Math.sin(duck.heading);
    const maxLen = scaleR / 0.7;
    let len = 0, px = duck.x, py = duck.y;
    for (let i = hist.length - 1; i > 0; i--) {
      const h = hist[i], p = hist[i - 1];
      if (h.u < 60 || h.dx * hx + h.dy * hy < 0.7) break;
      len += Math.hypot(h.x - p.x, h.y - p.y);
      px = p.x; py = p.y;
      if (len >= maxLen) break;
    }
    return { len: Math.hypot(px - duck.x, py - duck.y), x: px, y: py };
  }

  function updateScale(dt) {
    // while swimming, follow the wake; once the duck slows down, hold the last shape so it
    // can still be read while it fades
    if (duck.speed >= 60) {
      const run = wakeRun();
      const target = Math.min(scaleR, 0.7 * run.len);
      scaleCur += (target - scaleCur) * (1 - Math.exp(-dt * (target < scaleCur ? 4 : 3)));
      // point the V back along the chord of the path; straight behind the tail when unclear
      const want = run.len > 30 ? Math.atan2(run.y - duck.y, run.x - duck.x) : duck.heading + Math.PI;
      let d = want - scaleRot;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      scaleRot += d * (1 - Math.exp(-dt * 6));
    }
    // fade in quickly, fade out slowly so there's time to read it
    const show = smooth(25, 110, duck.speed) * smooth(30, 70, scaleCur);
    scaleAlpha += (show - scaleAlpha) * (1 - Math.exp(-dt * (show > scaleAlpha ? 9 : 0.7)));
  }

  function drawScaleMarks() {
    const R = scaleCur;
    const rot = scaleRot;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const at = (r, a) => {
      const lx = Math.cos(a) * r, ly = Math.sin(a) * r;
      return { x: duck.x + lx * cr - ly * sr, y: duck.y + lx * sr + ly * cr };
    };
    const tick = (a, r0, r1, w) => {
      const p = at(r0, a), q = at(r1, a);
      ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    };
    const K = KELVIN, DEG = Math.PI / 180;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';

    // edges of the wake
    ctx.setLineDash([10, 8]); ctx.lineWidth = 2.5;
    for (const sg of [-1, 1]) tick(K * sg, 40, R + 26, 2.5);
    ctx.setLineDash([]);

    // the arc itself
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const p = at(R, -K + 2 * K * i / 40);
      if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
    }
    ctx.stroke();

    // outer ticks: half-angle from the centre line
    for (let d = -19; d <= 19; d++) tick(d * DEG, R, R + (d % 5 === 0 ? 12 : 6), d % 5 === 0 ? 2.6 : 1.6);
    for (const sg of [-1, 1]) tick(K * sg, R, R + 14, 3);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 12px Fredoka, ui-rounded, system-ui, sans-serif';
    for (const d of [-10, 0, 10]) {
      const p = at(R + 22, d * DEG);
      ctx.fillText(Math.abs(d) + '°', p.x, p.y);
    }
    ctx.font = '700 13px Fredoka, ui-rounded, system-ui, sans-serif';
    for (const sg of [-1, 1]) {
      const p = at(R + 26, K * sg + sg * 3 * DEG);
      ctx.fillText('19.5°', p.x, p.y);
    }
    {
      ctx.font = '700 15px Fredoka, ui-rounded, system-ui, sans-serif';
      const p = at(R - 24, 0);
      ctx.fillText('39°', p.x, p.y);
    }
  }

  function render() {
    drawWater();
    drawRings();
    drawWake(true);
    drawWake(false);
    drawBow();
    drawScale();
    drawDuck();
  }

  // ---------- sound: cartoon plops, bubbles, paddle plips and birds ----------
  // Only short pitched tones (no noise), softened by a gentle low-pass and a small reverb.
  let audio = null;
  let wantSound = true;
  const btnSound = document.getElementById('sound');
  const ICON_BASE = '<svg viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#151515"/>';
  const ICON_ON = ICON_BASE + '<path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
  const ICON_OFF = ICON_BASE + '<path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  btnSound.innerHTML = ICON_OFF;

  function makeReverb(ac) {
    const len = Math.floor(ac.sampleRate * 1.8);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        lp += (Math.random() * 2 - 1 - lp) * 0.3;
        d[i] = lp * Math.pow(1 - i / len, 3.5);
      }
    }
    const conv = ac.createConvolver(); conv.buffer = ir;
    return conv;
  }

  function createAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const out = ac.createGain(); out.gain.value = 0;
    const tone = ac.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 4500; tone.Q.value = 0.4;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.3;
    out.connect(tone).connect(comp).connect(ac.destination);
    const bus = ac.createGain();
    const dry = ac.createGain(); dry.gain.value = 0.8;
    const verb = makeReverb(ac), wet = ac.createGain(); wet.gain.value = 0.25;
    bus.connect(dry).connect(out);
    bus.connect(verb).connect(wet).connect(out);
    const t = ac.currentTime;
    audio = { ac, out, bus, foot: 0,
      nextPlop: t + 0.8, nextBubbles: t + 4 + Math.random() * 4, nextBird: t + 3 + Math.random() * 4, nextPaddle: t };
    ac.onstatechange = syncSound;
  }

  function syncSound() {
    const on = !!(audio && wantSound && audio.ac.state === 'running');
    btnSound.setAttribute('aria-pressed', String(on));
    btnSound.innerHTML = on ? ICON_ON : ICON_OFF;
    btnSound.setAttribute('aria-label', on ? 'Mute' : 'Unmute');
    if (audio) audio.out.gain.setTargetAtTime(on ? 1 : 0, audio.ac.currentTime, on ? 0.6 : 0.15);
  }

  // Browsers only let sound start after a click, tap or key press.
  function unlock() {
    if (!wantSound) return;
    if (!audio) createAudio();
    if (audio && audio.ac.state !== 'running') audio.ac.resume().then(syncSound, () => {});
    syncSound();
  }
  window.addEventListener('pointerdown', e => { if (!btnSound.contains(e.target)) unlock(); }, true);
  window.addEventListener('keydown', unlock, true);

  btnSound.addEventListener('click', () => {
    const playing = audio && wantSound && audio.ac.state === 'running';
    wantSound = !playing;
    if (wantSound) unlock(); else syncSound();
  });

  function panner(v) {
    const ac = audio.ac;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(v, -1, 1); return p; }
    return ac.createGain();
  }

  // One cartoon blip: a sine whose pitch glides from f0 to f1, with a quick pop of volume.
  function blip(when, f0, f1, glide, gain, len, pan = 0, type = 'sine') {
    const { ac, bus } = audio;
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(f1, when + glide);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(gain, when + 0.006);
    g.gain.setTargetAtTime(0, when + 0.006, len / 4);
    o.connect(g).connect(panner(pan)).connect(bus);
    o.start(when); o.stop(when + len + 0.05);
  }

  // "plop": a drop landing; a low bloop sometimes follows
  function plop() {
    const t = audio.ac.currentTime + 0.02;
    const f = 420 + Math.random() * 380;
    const pan = Math.random() * 1.4 - 0.7;
    blip(t, f, f * 2.2, 0.07, 0.06, 0.12, pan);
    if (Math.random() < 0.4) blip(t + 0.09, f * 0.6, f * 0.35, 0.12, 0.035, 0.16, pan);
  }

  // a little string of rising bubbles
  function bubbles() {
    let t = audio.ac.currentTime + 0.02;
    const pan = Math.random() * 1.2 - 0.6;
    const n = 3 + Math.floor(Math.random() * 4);
    let f = 600 + Math.random() * 300;
    for (let i = 0; i < n; i++) {
      blip(t, f, f * 1.8, 0.05, 0.03, 0.07, pan);
      f *= 1.08 + Math.random() * 0.12;
      t += 0.06 + Math.random() * 0.07;
    }
  }

  function birds() {
    const { ac, bus } = audio;
    let t = ac.currentTime + 0.05;
    const base = 2300 + Math.random() * 1100;
    const n = 2 + Math.floor(Math.random() * 3);
    const outG = ac.createGain(); outG.gain.value = 0.6;
    outG.connect(panner(Math.random() * 1.6 - 0.8)).connect(bus);
    for (let i = 0; i < n; i++) {
      const o = ac.createOscillator(); o.type = 'sine';
      const f = base * (0.92 + Math.random() * 0.16);
      o.frequency.setValueAtTime(f, t);
      o.frequency.linearRampToValueAtTime(f * 1.25, t + 0.06);
      o.frequency.linearRampToValueAtTime(f * 0.92, t + 0.14);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.03, t + 0.025);
      g.gain.setTargetAtTime(0, t + 0.06, 0.03);
      o.connect(g).connect(outG); o.start(t); o.stop(t + 0.25);
      t += 0.17 + Math.random() * 0.12;
    }
  }

  function audioTick() {
    if (!audio || !wantSound || audio.ac.state !== 'running') return;
    const t = audio.ac.currentTime;
    if (t > audio.nextPlop) { plop(); audio.nextPlop = t + 1.2 + Math.random() * 2.8; }
    if (t > audio.nextBubbles) { bubbles(); audio.nextBubbles = t + 6 + Math.random() * 8; }
    if (t > audio.nextBird) { birds(); audio.nextBird = t + 7 + Math.random() * 11; }
    // paddling: left-right "plip-plop" that speeds up with the duck
    const sp = smooth(40, 650, duck.speed);
    if (sp > 0.04 && t > audio.nextPaddle) {
      audio.foot ^= 1;
      const pan = (duck.x / Math.max(1, W)) * 1.0 - 0.5 + (audio.foot ? 0.15 : -0.15);
      const f = (audio.foot ? 330 : 280) * (1 + 0.25 * sp) * (0.96 + Math.random() * 0.08);
      blip(t + 0.01, f, f * 1.9, 0.05, 0.03 + 0.04 * sp, 0.09, pan);
      audio.nextPaddle = t + (0.9 + Math.random() * 0.2) / (2 + 3 * sp);
    }
  }

  // ---------- input: the duck follows the pointer, no clicking needed ----------
  const follow = e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; };
  canvas.addEventListener('pointermove', follow);
  canvas.addEventListener('pointerdown', follow);
  canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pointer.active = false; });
  canvas.addEventListener('pointercancel', () => { pointer.active = false; });
  document.addEventListener('pointerleave', () => { pointer.active = false; });
  document.documentElement.addEventListener('mouseleave', () => { pointer.active = false; });
  window.addEventListener('blur', () => { pointer.active = false; });

  // ---------- loop ----------
  window.addEventListener('resize', resize);
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now; clock += dt;
    simT += dt;
    updateDuck(dt);
    // the scale shows while the duck swims and fades away once it stops
    updateScale(dt);
    computeWake();
    render();
    audioTick();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
